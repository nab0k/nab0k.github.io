name: Publish bilingual CV PDFs

on:
  push:
    paths:
      - '.github/cv-source.json.bz2.b64'
      - '.github/generate-cvs.py'
      - '.github/workflows/publish-ua-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-cvs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fonts and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'reportlab>=4,<5' 'pypdf>=5,<7'
      - name: Build and validate English and Ukrainian PDFs
        run: |
          python .github/generate-cvs.py
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          for filename in ('cv.pdf', 'cv-ua.pdf'):
              pdf = PdfReader(filename)
              assert len(pdf.pages) == 2, (filename, len(pdf.pages))
              txt = '\n'.join(page.extract_text() for page in pdf.pages)
              assert '20' in txt and '2026' in txt, (filename, 'missing deal value/year')
              assert Path(filename).stat().st_size > 20000
              print(filename, 'OK: 2 pages')
          PY
      - name: Publish updated PDFs
        run: |
          git add cv.pdf cv-ua.pdf
          if git diff --cached --quiet; then
            echo "CV PDFs unchanged"
          else
            git -c user.name='cv-publisher[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish updated bilingual CV PDFs'
            git push origin HEAD:main
          fi
