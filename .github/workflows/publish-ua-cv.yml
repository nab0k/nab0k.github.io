name: Publish Ukrainian CV PDF

on:
  push:
    paths:
      - '.github/cv-ua-builder.py.gz.b64'
      - '.github/workflows/publish-ua-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fonts and PDF library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'reportlab>=4,<5'
      - name: Generate Ukrainian CV
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          data = Path('.github/cv-ua-builder.py.gz.b64').read_text().strip()
          Path('/tmp/generate_cv_ua.py').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          python /tmp/generate_cv_ua.py
          pdfinfo cv-ua.pdf | grep 'Pages:'
      - name: Publish updated PDF
        run: |
          git add cv-ua.pdf
          if git diff --cached --quiet; then
            echo "CV PDF unchanged"
          else
            git -c user.name='cv-publisher[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish updated Ukrainian CV'
            git push origin HEAD:main
          fi
